[workspace]

[package]
name = "rust-ai-lint"
version = "0.2.0"
edition = "2021"
license = "ISC"
publish = false
description = "Convention linter built on the rust compiler itself, intended to run as a pre-commit hook"

[dependencies]
genemichaels-lib = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
all = "allow"
