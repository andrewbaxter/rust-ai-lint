[workspace]

[package]
name = "schemask-lint"
version = "0.1.0"
edition = "2021"
license = "ISC"
publish = false
description = "Convention linter for this repo, intended to run as a pre-commit hook"

[dependencies]
genemichaels-lib = "0.11"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits", "parsing"] }
ra_ap_ide = "=0.0.345"
ra_ap_ide_db = "=0.0.345"
ra_ap_hir = "=0.0.345"
ra_ap_load-cargo = "=0.0.345"
ra_ap_project_model = "=0.0.345"
ra_ap_vfs = "=0.0.345"
ra_ap_paths = "=0.0.345"
ra_ap_syntax = "=0.0.345"

[lints.clippy]
all = "allow"
